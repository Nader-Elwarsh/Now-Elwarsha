<div class="page-head"><h1>📞 مكالمة مشتركة ← أمر شغل</h1></div>
<div class="hint">اتشاركت المكالمة من تطبيق تاني (زي تطبيق تسجيل المكالمات). راجع البيانات تحت وكمّل أي حقل ناقص، وبعدين دوس "إنشاء أمر شغل".</div>
<section id="shareSummaryBox" class="profile-grid"></section>
<div id="shareAudioPreview" class="hidden" style="margin:10px 0"></div>
<div id="shareAttachExistingBox" class="hidden" style="margin:10px 0"></div>

<div class="form-grid">
<label class="wide">العميل<div class="select-add"><div class="part-autocomplete"><input type="text" id="qoCustomerSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم العميل أو رقم التليفون..." autocomplete="off" oninput="filterCustomerOptions('qoCustomer', this.value)" onfocus="filterCustomerOptions('qoCustomer', this.value)" onblur="hideCustomerResults('qoCustomer')"><input type="hidden" id="qoCustomer"><div id="qoCustomerResults" class="part-autocomplete-results hidden"></div></div><button type="button" class="secondary mini-action quick-add-btn" data-opens="qoCustomerBox" onclick="toggleQuickAdd('qoCustomerBox')">➕ عميل</button></div></label>
<div id="sharePhoneNote" class="hint"></div>
<section id="qoCustomerBox" class="quick-add hidden wide"><h3>➕ إضافة عميل سريع</h3><div class="form-grid"><label>اسم العميل<input id="qoName"></label><label>التليفون<input id="qoPhone" inputmode="tel"></label><label>المركز<div class="part-autocomplete"><input type="text" id="qoCenterSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم المركز..." autocomplete="off" oninput="filterListOptions('qoCenter', this.value)" onfocus="filterListOptions('qoCenter', this.value)" onblur="hideListResults('qoCenter')"><input type="hidden" id="qoCenter"><div id="qoCenterResults" class="part-autocomplete-results hidden"></div></div></label><label>القرية<div class="part-autocomplete"><input type="text" id="qoVillageSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم القرية..." autocomplete="off" oninput="filterListOptions('qoVillage', this.value)" onfocus="filterListOptions('qoVillage', this.value)" onblur="hideListResults('qoVillage')"><input type="hidden" id="qoVillage"><div id="qoVillageResults" class="part-autocomplete-results hidden"></div></div></label><label>الشارع / علامة مميزة <small>اختياري</small><input id="qoStreet"></label></div><div class="actions"><button type="button" class="primary" onclick="saveQuickCustomerHome()">💾 حفظ العميل واختياره</button><button type="button" class="secondary" onclick="closeQuickAdd('qoCustomerBox')">إلغاء</button></div></section>
<label class="wide">الجهاز<div class="select-add"><select id="qoDevice"></select><button type="button" class="secondary mini-action quick-add-btn" data-opens="qoDeviceBox" onclick="toggleQuickAdd('qoDeviceBox')">➕ جهاز</button></div></label>
<section id="qoDeviceBox" class="quick-add hidden wide"><h3>➕ إضافة جهاز سريع</h3><div class="form-grid"><label>نوع الجهاز<div class="part-autocomplete"><input type="text" id="qoTypeSearch" class="part-autocomplete-input" placeholder="🔍 اكتب نوع الجهاز..." autocomplete="off" oninput="filterListOptions('qoType', this.value)" onfocus="filterListOptions('qoType', this.value)" onblur="hideListResults('qoType')"><input type="hidden" id="qoType"><div id="qoTypeResults" class="part-autocomplete-results hidden"></div></div></label><label>التصنيف<div class="part-autocomplete"><input type="text" id="qoCategorySearch" class="part-autocomplete-input" placeholder="🔍 اكتب التصنيف..." autocomplete="off" oninput="filterListOptions('qoCategory', this.value)" onfocus="filterListOptions('qoCategory', this.value)" onblur="hideListResults('qoCategory')"><input type="hidden" id="qoCategory"><div id="qoCategoryResults" class="part-autocomplete-results hidden"></div></div></label><label>الماركة<div class="part-autocomplete"><input type="text" id="qoBrandSearch" class="part-autocomplete-input" placeholder="🔍 اكتب اسم الماركة..." autocomplete="off" oninput="filterListOptions('qoBrand', this.value)" onfocus="filterListOptions('qoBrand', this.value)" onblur="hideListResults('qoBrand')"><input type="hidden" id="qoBrand"><div id="qoBrandResults" class="part-autocomplete-results hidden"></div></div></label><label>الموديل <small>اختياري</small><input id="qoModel"></label></div><div class="actions"><button type="button" class="primary" onclick="saveQuickDeviceHome()">💾 حفظ الجهاز واختياره</button><button type="button" class="secondary" onclick="closeQuickAdd('qoDeviceBox')">إلغاء</button></div></section>
<label class="wide">وصف العطل<textarea id="qoFault" placeholder="مثال: تاخر برنامج الغسالة"></textarea></label>
</div>
<div class="actions"><button type="button" class="primary" onclick="createRequestFromCallShare()">➕ إنشاء أمر شغل</button><a class="secondary" href="index.html">إلغاء</a></div>
