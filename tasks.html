<div class="page-topbar"><a class="back" href="index.html">← الرئيسية</a><button class="theme-toggle-btn no-print" type="button" onclick="toggleTheme()" aria-label="تبديل المظهر" title="الوضع الداكن">🌙</button></div>
<div class="page-head"><div><h1>📋 المهام والمتابعة</h1><p class="hint">قسم مستقل للمتابعات اليومية، ولا يؤثر على حسابات العملاء أو الأوامر أو الخزنة.</p></div></div>
<section class="panel">
<h2>➕ مهمة جديدة</h2>
<div class="form-grid">
<label>عنوان المهمة<input id="taskTitle" placeholder="مثال: تابع عميل، اطلب قطعة، راجع أمر..."></label>
<label>التاريخ<input id="taskDate" type="date"></label>
<label>الوقت<input id="taskTime" type="time"></label>

<label>العميل (اختياري)<select id="taskCustomer"><option value="">بدون ربط بعميل</option></select></label>
<label>أمر الشغل (اختياري)<select id="taskRequest"><option value="">بدون ربط بأمر شغل</option></select></label>
<label class="wide">التفاصيل<input id="taskNote" placeholder="أي تفاصيل أو ملاحظات للمتابعة"></label>
</div>
<div class="actions"><button type="button" class="primary" onclick="saveTask()">💾 حفظ المهمة</button><button type="button" class="secondary" onclick="clearTaskForm()">↩️ تفريغ</button></div>
</section>
<section class="panel ps-context-target" data-ps-title="ملخص المهام">
<div class="dash-head"><h2>📊 المتابعة</h2><span class="ps-inline-actions no-print" aria-label="إجراءات الطباعة والمشاركة"><button type="button" class="ps-icon-btn" title="طباعة" aria-label="طباعة" onclick="printWorkshopTarget(this)">🖨️</button><button type="button" class="ps-icon-btn" title="مشاركة" aria-label="مشاركة" onclick="shareWorkshopTarget(this)">↗️</button></span><span class="hint">يمكنك إغلاق المهمة ثم إعادة فتحها في أي وقت</span></div>
<div id="taskStats"></div>
<div class="form-grid">
<label class="wide">🔍 بحث<input id="taskSearch" placeholder="ابحث في عنوان المهمة أو التفاصيل أو اسم العميل"></label>
<label>عرض<select id="taskFilter"><option value="open">المفتوحة</option><option value="today">مهام اليوم</option><option value="overdue">المتأخرة</option><option value="done">المكتملة</option><option value="all">الكل</option></select></label>
</div>
<div id="taskList"></div>
</section>
